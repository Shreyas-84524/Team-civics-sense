<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicFix Certificate Verification Portal</title>
  <meta name="description" content="Official CivicFix Public Certificate Verification Portal. Verify authentic citizen achievements and civic contributions.">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
</head>
<body>
  <nav class="portal-nav">
    <div class="brand-container">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      <span>CivicFix Verification Portal</span>
    </div>
  </nav>

  <main class="main-container">
    <div id="app-root">
      <div class="loading-container">
        <div class="spinner"></div>
        <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem;">Verifying Certificate Authenticity...</h3>
        <p style="font-size: 0.85rem; color: var(--text-secondary);">Validating cryptographic verification reference with municipal records.</p>
      </div>
    </div>

    <footer class="footer-authority">
      <div style="font-weight: 600; color: var(--text-primary); margin-bottom: 0.25rem;">Official CivicFix Municipal Governance Portal</div>
      <div>Valid for verification by educational institutions, employers, and civic organizations.</div>
    </footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
